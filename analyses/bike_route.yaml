analyses:
  main:
    query: |
      {{ this }};out geom;
    feature:
      group: total

  infra_type:
    query: |
      {{ this }};way(r);out geom;
    feature:
      group: |
        {% if tags.highway == "cycleway" and tags.segregated == "no" %}
        mixed
        {% elseif tags.bicycle_road == "yes" %}
        bicycle_road
        {% elseif tags.highway %}
        {{ tags.highway }}
        {% else %}
        other
        {% endif %}

  surface:
    query: |
      {{ this }};way(r);out geom;
    feature:
      group: |
        {{ tags.surface|default('unknown') }}
